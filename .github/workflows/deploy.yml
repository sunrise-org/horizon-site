name: deploy

on:
  push:
    branches: [release/sunrise]
  pull_request:
    branches: [release/sunrise]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: hub.umceko.com/sunrise/site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: hub.umceko.com
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          build-args: |
            SITE_URL=https://playsunrise.net
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:release-sunrise
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: sunrise-org/infra
          ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}

      - name: Bump the site image; ArgoCD rolls it out
        run: |
          git config user.name "sunrise-bot"
          git config user.email "sunrise-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull -q --rebase
            sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" apps/site/kustomization.yaml
            git diff --quiet && exit 0
            git commit -qam "site: deploy ${GITHUB_SHA::7} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            git push -q && exit 0
            git reset -q --hard origin/main
          done
          exit 1
