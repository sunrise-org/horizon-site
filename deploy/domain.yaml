apiVersion: v1
kind: ConfigMap
metadata:
  name: site-domain
  namespace: sunrise
data:
  SITE_URL: https://playsunrise.net
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sunrise-dns
  namespace: sunrise
spec:
  acme:
    email: admin@umceko.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: sunrise-acme-account
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: sunrise-dns
              key: api-token
        selector:
          dnsZones: [playsunrise.net]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sunrise-tls
  namespace: sunrise
spec:
  secretName: sunrise-tls
  issuerRef:
    name: sunrise-dns
    kind: Issuer
  dnsNames:
    - playsunrise.net
    - "*.playsunrise.net"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sunrise
  namespace: sunrise
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: apex
      hostname: playsunrise.net
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: sunrise-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: subdomains
      hostname: "*.playsunrise.net"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: sunrise-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: sunrise
spec:
  parentRefs:
    - name: sunrise
      sectionName: apex
  hostnames: [playsunrise.net]
  rules:
    - backendRefs:
        - name: site
          port: 80
      timeouts:
        request: 120s
        backendRequest: 120s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: sunrise
spec:
  parentRefs:
    - name: sunrise
      sectionName: http
  hostnames: [playsunrise.net, "*.playsunrise.net"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: subdomain-redirect
  namespace: sunrise
spec:
  parentRefs:
    - name: sunrise
      sectionName: subdomains
  hostnames: ["*.playsunrise.net"]
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: playsunrise.net
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: perf-redirect
  namespace: sunrise
spec:
  parentRefs:
    - name: sunrise
      sectionName: subdomains
  hostnames: [perf.playsunrise.net]
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: playsunrise.net
            path:
              type: ReplaceFullPath
              replaceFullPath: /perf
            statusCode: 301
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: playsunrise.net
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: sunrise-client-ip
  namespace: sunrise
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: sunrise
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
